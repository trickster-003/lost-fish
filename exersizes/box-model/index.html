<!DOCTYPE html>
<html>

<head>
    <title>box model</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="main.css">
</head>

<body>
    

<!-- block elemants will take up 100% of the width of their container and will stack vertically on top of one another -->
<div class="block">block</div>
<div class="block">block</div>
<div class="block">block</div>

<!-- inline eemants only take up as much space as their content requires and will nest horizontaly next to one another if there is space to do so -->

<span class="inline">inline</span>
<span class="inline">inline</span>
<span class="inline">inline</span>
<span class="inline">inline</span>
<span class="inline">inline</span>

<span class="inline-block">inline-block</span>
<span class="inline-block">inline-block</span>
<span class="inline-block">inline-block</span>
<span class="inline-block">inline-block</span>

<div class="content-box">content-box</div>

<div class="border-box">border-box</div>

</body>

</html>
